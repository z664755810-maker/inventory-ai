<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京东电子商品物流系统 - 登录</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo-icon">📦</div>
            <h2>京东电子商品物流系统</h2>
            <p class="login-subtitle">业务管理平台 · Demo</p>

            <!-- 错误提示 -->
            <div id="error-message" class="login-error" style="display: none;"></div>

            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <button class="btn btn-primary" onclick="handleLogin()">登录</button>

            <!-- 默认演示账号提示 -->
            <div class="login-hint">
                <strong>演示账号：</strong>admin / admin
                <button type="button" class="btn-fill" onclick="fillDemoAccount()">一键填入</button>
            </div>

            <!-- 链接区域 -->
            <div class="login-links">
                <a href="javascript:void(0)" onclick="showRegisterModal()">注册账号</a>
                <a href="javascript:void(0)" onclick="showForgotPasswordModal()">忘记密码</a>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
        // 显示错误消息
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        // 登录处理
        async function handleLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }
            
            try {
                await api.login(username, password);
                window.location.href = 'index.html';
            } catch (error) {
                showError(error.message);
            }
        }
        
        // 注册模态框
        function showRegisterModal() {
            createModal('注册账号', `
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="reg-username" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="reg-password" placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="reg-password-confirm" placeholder="请再次输入密码">
                </div>
            `, async () => {
                const username = document.getElementById('reg-username').value;
                const password = document.getElementById('reg-password').value;
                const confirmPassword = document.getElementById('reg-password-confirm').value;
                
                if (!username || !password) {
                    throw new Error('请填写完整信息');
                }
                
                if (password !== confirmPassword) {
                    throw new Error('两次输入的密码不一致');
                }
                
                await api.register(username, password);
                alert('注册成功，请登录');
            });
        }
        
        // 忘记密码模态框
        function showForgotPasswordModal() {
            createModal('忘记密码', `
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="fp-username" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>新密码</label>
                    <input type="password" id="fp-password" placeholder="请输入新密码">
                </div>
                <div class="form-group">
                    <label>确认新密码</label>
                    <input type="password" id="fp-password-confirm" placeholder="请再次输入新密码">
                </div>
            `, async () => {
                const username = document.getElementById('fp-username').value;
                const password = document.getElementById('fp-password').value;
                const confirmPassword = document.getElementById('fp-password-confirm').value;
                
                if (!username || !password) {
                    throw new Error('请填写完整信息');
                }
                
                if (password !== confirmPassword) {
                    throw new Error('两次输入的密码不一致');
                }
                
                await api.forgotPassword(username, password);
                alert('密码重置成功，请登录');
            });
        }
        
        // 回车键登录
        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });

        // 一键填入演示账号
        function fillDemoAccount() {
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = 'admin';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京东电子商品物流系统 - 用户管理</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">📦</div>
                    <h1>京东电子商品物流系统</h1>
                </div>
            </div>
            <div class="sidebar-menu">
                <ul>
                    <li><a href="index.html"><i>🏠</i> 系统首页</a></li>
                    <li><a href="users.html" class="active"><i>👥</i> 用户管理</a></li>
                    <li><a href="categories.html"><i>📁</i> 商品类型</a></li>
                    <li><a href="products.html"><i>📦</i> 商品档案</a></li>
                    <li><a href="customers.html"><i>👤</i> 客户档案</a></li>
                    <li><a href="purchase-orders.html"><i>📥</i> 采购入库</a></li>
                    <li><a href="sales-orders.html"><i>📤</i> 销售出库</a></li>
                    <li><a href="stock.html"><i>📊</i> 库存查询</a></li>
                    <li><a href="invoices.html"><i>🧾</i> 发票管理</a></li>
                </ul>
            </div>
        </div>
        <div class="content">
            <div class="header">
                <h2>👥 用户管理</h2>
                <div class="user-info">
                    <span>欢迎, <strong>Admin</strong></span>
                    <div class="user-avatar">A</div>
                    <button class="logout-btn" onclick="handleLogout()"><i>🚪</i> 退出登录</button>
                </div>
            </div>
            <div class="page-content">
                <div class="card">
                    <div class="card-header">
                        <h3>用户列表</h3>
                        <button class="btn btn-primary" onclick="showAddModal()">添加用户</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="userTable">
                            <tr><td colspan="4" style="text-align: center; color: #b8b8d0;">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
        async function loadUsers() {
            try {
                const users = await api.getUsers();
                const tbody = document.getElementById('userTable');
                tbody.innerHTML = users.map(user => `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.username}</td>
                        <td>${formatDate(user.created_at)}</td>
                        <td>
                            <div class="table-actions">
                                <button class="btn-edit" onclick="showEditModal(${user.id})">编辑</button>
                                <button class="btn-delete" onclick="deleteUser(${user.id})">删除</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showAlert(error.message, 'error');
            }
        }
        
        function showAddModal() {
            createModal('添加用户', `
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="new-username" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="new-password" placeholder="请输入密码">
                </div>
            `, async () => {
                const username = document.getElementById('new-username').value;
                const password = document.getElementById('new-password').value;
                
                if (!username || !password) {
                    throw new Error('请填写完整信息');
                }
                
                await api.createUser({ username, password });
                showAlert('用户添加成功');
                loadUsers();
            });
        }
        
        async function showEditModal(id) {
            const user = await api.getUser(id);
            createModal('编辑用户', `
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="edit-username" value="${user.username}">
                </div>
                <div class="form-group">
                    <label>新密码（留空则不修改）</label>
                    <input type="password" id="edit-password" placeholder="请输入新密码">
                </div>
            `, async () => {
                const data = {
                    username: document.getElementById('edit-username').value
                };
                const password = document.getElementById('edit-password').value;
                if (password) {
                    data.password = password;
                }
                
                await api.updateUser(id, data);
                showAlert('用户更新成功');
                loadUsers();
            });
        }
        
        async function deleteUser(id) {
            if (!confirm('确定要删除该用户吗？')) return;
            
            try {
                await api.deleteUser(id);
                showAlert('用户删除成功');
                loadUsers();
            } catch (error) {
                showAlert(error.message, 'error');
            }
        }
        
        document.addEventListener('DOMContentLoaded', async () => {
            await loadCurrentUser();
            await loadUsers();
        });
    </script>
</body>
</html>

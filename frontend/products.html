<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>义乌商品物流系统 - 商品档案</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">📦</div>
                    <h1>义乌商品物流系统</h1>
                </div>
            </div>
            <div class="sidebar-menu">
                <ul>
                    <li><a href="index.html"><i>🏠</i> 系统首页</a></li>
                    <li><a href="users.html"><i>👥</i> 用户管理</a></li>
                    <li><a href="categories.html"><i>📁</i> 商品类型</a></li>
                    <li><a href="products.html" class="active"><i>📦</i> 商品档案</a></li>
                    <li><a href="customers.html"><i>👤</i> 客户档案</a></li>
                    <li><a href="purchase-orders.html"><i>📥</i> 采购入库</a></li>
                    <li><a href="sales-orders.html"><i>📤</i> 销售出库</a></li>
                    <li><a href="stock.html"><i>📊</i> 库存查询</a></li>
                    <li><a href="invoices.html"><i>🧾</i> 发票管理</a></li>
                </ul>
            </div>
        </div>
        <div class="content">
            <div class="header">
                <h2>📦 商品档案管理</h2>
                <div class="user-info">
                    <span>欢迎, <strong>Admin</strong></span>
                    <div class="user-avatar">A</div>
                    <button class="logout-btn" onclick="handleLogout()"><i>🚪</i> 退出登录</button>
                </div>
            </div>
            <div class="page-content">
                <div class="card">
                    <div class="card-header">
                        <h3>商品列表</h3>
                        <button class="btn btn-primary" onclick="showAddModal()">添加商品</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>商品名称</th>
                                <th>类别</th>
                                <th>单位</th>
                                <th>参考价格</th>
                                <th>库存</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="productTable">
                            <tr><td colspan="7" style="text-align: center; color: #b8b8d0;">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
        let categories = [];
        
        async function loadCategories() {
            categories = await api.getCategories();
        }
        
        async function loadProducts() {
            try {
                const products = await api.getProducts();
                const tbody = document.getElementById('productTable');
                tbody.innerHTML = products.map(product => `
                    <tr>
                        <td>${product.id}</td>
                        <td>${product.name}</td>
                        <td>${product.category_name || '-'}</td>
                        <td>${product.unit || '-'}</td>
                        <td>${formatCurrency(product.price)}</td>
                        <td>${product.stock}</td>
                        <td>
                            <div class="table-actions">
                                <button class="btn-edit" onclick="showEditModal(${product.id})">编辑</button>
                                <button class="btn-delete" onclick="deleteProduct(${product.id})">删除</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showAlert(error.message, 'error');
            }
        }
        
        function getCategoryOptions(selectedId = null) {
            return categories.map(cat => 
                `<option value="${cat.id}" ${cat.id === selectedId ? 'selected' : ''}>${cat.name}</option>`
            ).join('');
        }
        
        function showAddModal() {
            createModal('添加商品', `
                <div class="form-group">
                    <label>商品名称</label>
                    <input type="text" id="prod-name" placeholder="请输入商品名称">
                </div>
                <div class="form-group">
                    <label>商品类别</label>
                    <select id="prod-category">
                        <option value="">请选择类别</option>
                        ${getCategoryOptions()}
                    </select>
                </div>
                <div class="form-group">
                    <label>计量单位</label>
                    <input type="text" id="prod-unit" placeholder="如：件、个、箱">
                </div>
                <div class="form-group">
                    <label>参考价格</label>
                    <input type="number" step="0.01" id="prod-price" placeholder="请输入参考价格">
                </div>
                <div class="form-group">
                    <label>初始库存</label>
                    <input type="number" id="prod-stock" value="0">
                </div>
            `, async () => {
                const data = {
                    name: document.getElementById('prod-name').value,
                    category_id: document.getElementById('prod-category').value || null,
                    unit: document.getElementById('prod-unit').value,
                    price: parseFloat(document.getElementById('prod-price').value) || null,
                    stock: parseInt(document.getElementById('prod-stock').value) || 0
                };
                
                if (!data.name) {
                    throw new Error('请输入商品名称');
                }
                
                await api.createProduct(data);
                showAlert('商品添加成功');
                loadProducts();
            });
        }
        
        async function showEditModal(id) {
            const product = await api.getProduct(id);
            createModal('编辑商品', `
                <div class="form-group">
                    <label>商品名称</label>
                    <input type="text" id="edit-name" value="${product.name}">
                </div>
                <div class="form-group">
                    <label>商品类别</label>
                    <select id="edit-category">
                        <option value="">请选择类别</option>
                        ${getCategoryOptions(product.category_id)}
                    </select>
                </div>
                <div class="form-group">
                    <label>计量单位</label>
                    <input type="text" id="edit-unit" value="${product.unit || ''}">
                </div>
                <div class="form-group">
                    <label>参考价格</label>
                    <input type="number" step="0.01" id="edit-price" value="${product.price || ''}">
                </div>
                <div class="form-group">
                    <label>库存数量</label>
                    <input type="number" id="edit-stock" value="${product.stock}">
                </div>
            `, async () => {
                const data = {
                    name: document.getElementById('edit-name').value,
                    category_id: document.getElementById('edit-category').value || null,
                    unit: document.getElementById('edit-unit').value,
                    price: parseFloat(document.getElementById('edit-price').value) || null,
                    stock: parseInt(document.getElementById('edit-stock').value) || 0
                };
                
                if (!data.name) {
                    throw new Error('请输入商品名称');
                }
                
                await api.updateProduct(id, data);
                showAlert('商品更新成功');
                loadProducts();
            });
        }
        
        async function deleteProduct(id) {
            if (!confirm('确定要删除该商品吗？')) return;
            
            try {
                await api.deleteProduct(id);
                showAlert('商品删除成功');
                loadProducts();
            } catch (error) {
                showAlert(error.message, 'error');
            }
        }
        
        document.addEventListener('DOMContentLoaded', async () => {
            await loadCurrentUser();
            await loadCategories();
            await loadProducts();
        });
    </script>
</body>
</html>
